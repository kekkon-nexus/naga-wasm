[package]
name = "naga-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "naga"
crate-type = ["cdylib", "rlib"]

[dependencies]
upstream = { package = "naga", version = "=30.0.1", features = ["glsl-in", "glsl-out", "hlsl-out", "msl-out", "spv-in", "spv-out", "wgsl-in", "wgsl-out"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.128"
