customCatalog:
  schemas:
    - name: tsconfig
      description: Nested TypeScript project configs
      fileMatch:
        - "**/tsconfig.json"
      location: https://www.schemastore.org/tsconfig.json
    - name: v8r
      description: v8r config in .config
      fileMatch:
        - ".config/v8rrc.yaml"
      location: https://raw.githubusercontent.com/chris48s/v8r/main/config-schema.json
