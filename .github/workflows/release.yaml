name: Release

on:
  push:
    branches:
      - main
    paths:
      - npm/package.json
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    environment: publish
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(node -p 'require("./npm/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "naga=$(sed -n 's/^export const nagaVersion = "\(.*\)";$/\1/p' npm/src/version.ts)" >> "$GITHUB_OUTPUT"
          if [ "$version" != "0.0.0" ] && [ -z "$(npm view "naga-wasm@$version" version 2>/dev/null)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish
        uses: ./.github/actions/setup
      - if: steps.version.outputs.publish
        run: bun run test
      - if: steps.version.outputs.publish
        run: npm install --global npm@latest && npm publish --provenance --access public
        working-directory: npm
      - if: steps.version.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAGA: ${{ steps.version.outputs.naga }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes "Bundles naga $NAGA." --generate-notes
