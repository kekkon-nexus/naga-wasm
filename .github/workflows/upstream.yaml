name: Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  upstream:
    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
      - id: check
        run: bun scripts/check-upstream.ts

      - if: steps.check.outputs.version
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: ""
      - if: steps.check.outputs.version
        run: cargo update --package naga

      - if: steps.check.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream/naga-${{ steps.check.outputs.version }}
          commit-message: "build(deps): bump naga to ${{ steps.check.outputs.version }}"
          title: "build(deps): bump naga to ${{ steps.check.outputs.version }}"
          labels: ${{ steps.check.outputs.kind == 'major' && 'upstream-major' || '' }}
