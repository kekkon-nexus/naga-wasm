[package]
name = "naga-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "naga_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-in", "spv-in", "wgsl-out", "glsl-out", "hlsl-out", "msl-out", "spv-out"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
